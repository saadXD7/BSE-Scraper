<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Annual Report AI Engine</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        input[type="text"] { width: 80%; padding: 10px; font-size: 16px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .response-box { margin-top: 30px; padding: 20px; background: #e9ecef; border-left: 5px solid #007bff; white-space: pre-wrap; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 Annual Report AI Engine</h1>
        <p>Ask questions about the financial tables and report context.</p>
        <form method="POST" action="/query">
            <input type="text" name="question" placeholder="e.g., What drove the revenue increase in 2024?" required>
            <button type="submit">Ask AI</button>
        </form>

        {% if answer %}
        <div class="response-box">
            <strong>Query:</strong> {{ question }}<br><br>
            <strong>Response & Citations:</strong><br>{{ answer }}
        </div>
        {% endif %}
    </div>
</body>
</html>
